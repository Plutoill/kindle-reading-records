<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>阅读记录</title>
<link rel="stylesheet" href="style.css?v=52" />
</head>
<body>
<div id="message" class="message"></div>

<div id="mainTabs" class="tabs">
  <button id="tabToday" class="tab active">当日阅读</button>
  <button id="tabTotal" class="tab">累计阅读</button>
  <button id="tabBooks" class="tab">我的书籍</button>
</div>
<div id="syncStatus" class="sync-status">正在同步</div>

<div id="todayPage" class="page">
  <div class="day-switch"><button id="prevDay" class="day-switch-btn">‹</button><span>当日阅读</span><button id="nextDay" class="day-switch-btn">›</button></div>
  <div id="selectedDateLabel" class="selected-date"></div>
  <div class="summary-block"><div id="todayTotal" class="summary-total">0分钟</div><div id="todaySummary" class="summary-meta">阅读0本</div></div>
  <div class="section-head"><span>阅读书籍</span><button id="todayAll" class="link-btn">查看全部 ›</button></div>
  <div id="recentList" class="list"></div>
  <div id="todayPager" class="pager hidden"></div>
  <div class="update" id="updatedAt"></div>
</div>

<div id="totalPage" class="page hidden">
  <div class="day-switch"><button id="prevYear" class="day-switch-btn">‹</button><span id="yearTitle">2026年</span><button id="nextYear" class="day-switch-btn">›</button></div>
  <div class="summary-block"><div id="yearTotal" class="summary-total">0分钟</div><div id="yearSummary" class="summary-meta">阅读0天 · 日均0分钟</div></div>
  <div class="section-head"><span>月度阅读</span></div>
  <div id="months" class="months"></div>
  <div class="hint">点击月份查看当月阅读详情</div>
</div>

<div id="booksPage" class="page hidden">
  <div class="sortbar"><span id="scopeLabel" class="books-heading">所有书籍</span><button id="sortOpen" class="sort-btn">排序：<b id="sortLabel">最近阅读</b> ▾</button></div>
  <div id="booksList" class="list"></div>
  <div id="booksPager" class="pager hidden"></div>
</div>

<div id="detailPage" class="page hidden">
  <div class="detail-header"><button id="detailBack" class="back-btn">‹</button><span id="detailTitle">详情</span></div>
  <div id="detailBody"></div>
</div>

<div id="sortOverlay" class="overlay filter-overlay hidden">
  <div class="dialog filter-dialog">
    <div class="dialog-title">筛选与排序</div>
    <div class="dialog-section-title">显示范围</div>
    <button class="scope-option" data-scope="local">本机书籍</button>
    <button class="scope-option selected" data-scope="all">全部书籍</button>
    <div class="dialog-section-title">排序方式</div>
    <button class="sort-option" data-sort="recent">最近阅读</button>
    <button class="sort-option" data-sort="total_desc">总阅读时长（从多到少）</button>
    <button class="sort-option" data-sort="total_asc">总阅读时长（从少到多）</button>
    <button class="sort-option" data-sort="count_desc">阅读次数（从多到少）</button>
    <button class="sort-option" data-sort="count_asc">阅读次数（从少到多）</button>
    <button id="sortCancel" class="dialog-cancel">取消</button>
  </div>
</div>

<script src="script.js?v=52"></script>
</body>
</html>
